name: Uptime Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: uptime-state
          path: state

      - name: Run uptime check
        env:
          CHECK_URL: https://dkstore.ltk.id.vn/ping
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          STATE_FILE: state/status.json
        run: python .github/scripts/uptime_check.py

      - name: Save state
        if: always()
        working-directory: state
        run: |
          git config user.name "uptime-bot"
          git config user.email "uptime-bot@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "uptime: update status"
          git push origin uptime-state
